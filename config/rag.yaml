# Fitness KB RAG pipeline configuration (Phase 4.5)

retrieval_config: config/retrieval.yaml
aliases_path: config/aliases.yaml

rag:
  retrieval_mode: hybrid
  # Candidate pool before rerank (FAISS / hybrid)
  top_k_retrieve: 20
  min_top_k: 3
  max_top_k: 10
  top_k_rerank: 5
  dedupe_by: none  # diversity module handles docs; keep candidates
  confidence_threshold: 0.01
  min_semantic_score: 0.50
  min_semantic_score_multilingual: 0.40
  min_grounding_overlap: 0.6
  non_english_faiss_only: true
  insufficient_knowledge_message: >-
    I don't have enough information in my knowledge base to answer that confidently.

  # Feature flags
  enable_reranker: false
  enable_query_normalization: true
  enable_language_detection: true
  enable_dynamic_topk: true
  enable_source_diversity: true
  enable_conversation_context: true
  structured_logging: true

  # Conversation
  max_history: 4

  # Source diversity
  max_chunks_per_doc: 2
  max_chunks_per_section: 1
  semantic_jaccard_max: 0.85

  # Dynamic top-k bands (confidence → final context count)
  dynamic_topk:
    high_threshold: 0.7
    medium_threshold: 0.4
    high_k: 3
    medium_k: 5
    low_k: 10

llm:
  provider: extractive
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 800
  base_url: null
  system_prompt: null

# Cross-encoder: prefer v2-m3; enable with ENABLE_RERANKER / enable_reranker
# Default false keeps CPU latency low; set true for production GPU/CPU quality.
reranker:
  provider: noop
  model: BAAI/bge-reranker-v2-m3
  top_k: 5
  batch_size: 16
  device: auto
  fallback_model: BAAI/bge-reranker-base

# Feature default: enable_reranker false until model warm; flip in rag: section


api:
  host: 0.0.0.0
  port: 8080
  title: Fitness Knowledge RAG
  cors_origins:
    - "*"

eval:
  questions_path: evaluation/questions.jsonl
  hallucination_path: evaluation/hallucination_questions.jsonl
  report_path: evaluation/rag_report.md
  confidence_report_path: evaluation/confidence_report.md
  benchmark_report_path: evaluation/benchmark_phase45.md
  min_questions: 100

logging:
  level: INFO
  json: true
